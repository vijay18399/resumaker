<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Resumaker — Resume Made Simple</title>
  <desc id="svgDesc">Build and edit your resume with guided sections, a live preview, and PDF export.</desc>
  <defs>
    <!-- Background Gradient: Subtle clean porcelain into soft warm slate -->
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fafbfd"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Brand Signature Coral / Rausch Gradient -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a5f"/>
      <stop offset="50%" stop-color="#ff385c"/>
      <stop offset="100%" stop-color="#d70466"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff385c"/>
      <stop offset="100%" stop-color="#e00b41"/>
    </linearGradient>

    <!-- Figma Multi-Layer Ambient Shadows -->
    <filter id="elevatedCard" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#0f172a" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <filter id="sheetShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>

    <filter id="subtlePill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Ambient Figma Glow Orbs -->
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#fef2f2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="slateGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Figma Technical Dot Matrix Grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.45"/>
    </pattern>

    <clipPath id="studioFrame">
      <rect x="0" y="0" width="530" height="480" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", Helvetica, Arial, sans-serif; }
    .text-title { fill: #0f172a; font-weight: 800; }
    .text-muted { fill: #64748b; font-weight: 500; }
    .text-dark { fill: #1e293b; }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1200" height="630" fill="url(#bgCanvas)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>
  <circle cx="950" cy="260" r="420" fill="url(#orbGlow)"/>
  <circle cx="200" cy="520" r="300" fill="url(#slateGlow)"/>

  <!-- ================= LEFT HERO COLUMN ================= -->
  <g transform="translate(84, 84)">
    <!-- Brand Logo & Name -->
    <g transform="translate(0, 0)">
      <rect width="44" height="44" rx="12" fill="url(#brandGrad)" filter="url(#subtlePill)"/>
      <!-- Folded Document Icon Matching Favicon Design -->
      <path d="M15 11h11l7 7v15a2 2 0 0 1-2 2H15a2 2 0 0 1-2-2V13a2 2 0 0 1 2-2z" fill="#ffffff"/>
      <path d="M26 11v6a1 1 0 0 0 1 1h6z" fill="#fecdd3"/>
      <!-- Content lines -->
      <rect x="17" y="22" width="10" height="2" rx="1" fill="#ff385c"/>
      <rect x="17" y="26" width="14" height="1.8" rx="0.9" fill="#94a3b8"/>
      <rect x="17" y="30" width="11" height="1.8" rx="0.9" fill="#cbd5e1"/>
      <text x="58" y="31" class="font-sans text-title" font-size="28" letter-spacing="-0.03em">Resumaker</text>
    </g>

    <!-- Clean Headlines: "Resume Made Simple" -->
    <g transform="translate(0, 96)">
      <text x="0" y="44" class="font-sans text-title" font-size="50" letter-spacing="-0.03em">Resume</text>
      <text x="0" y="102" class="font-sans" font-size="52" font-weight="850" letter-spacing="-0.035em" fill="url(#textGrad)">Made Simple.</text>
      
      <text x="0" y="152" class="font-sans text-muted" font-size="20" font-weight="500">Type your details. See it come alive.</text>
    </g>

    <!-- Clean Feature Pills (No 'Free', No 'Open Source') -->
    <g transform="translate(0, 326)">
      <!-- Pill 1: ATS Friendly -->
      <g>
        <rect width="144" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#subtlePill)"/>
        <path d="M18 22l4.5 4.5 9-9" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="39" y="27" class="font-sans text-dark" font-size="13.5" font-weight="700">Live Preview</text>
      </g>
      <!-- Pill 2: 8 Curated Templates -->
      <g transform="translate(156, 0)">
        <rect width="144" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#subtlePill)"/>
        <rect x="17" y="14" width="13" height="16" rx="2" fill="none" stroke="#64748b" stroke-width="1.8"/>
        <path d="M23 18h4M23 22h4" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
        <text x="39" y="27" class="font-sans text-dark" font-size="13.5" font-weight="700">JSON Import</text>
      </g>
      <!-- Pill 3: Instant Export -->
      <g transform="translate(312, 0)">
        <rect width="148" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#subtlePill)"/>
        <path d="M20 15v10m-4-4l4 4 4-4M14 28h12" fill="none" stroke="#ff385c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="40" y="27" class="font-sans text-dark" font-size="13.5" font-weight="700">PDF Export</text>
      </g>
    </g>

    <!-- Footer URL -->
    <g transform="translate(0, 412)">
      <circle cx="6" cy="6" r="4.5" fill="#ff385c"/>
      <text x="20" y="10.5" class="font-sans" font-size="15" font-weight="600" fill="#64748b">vijayreddy.dev/resumaker</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: ABSTRACT RESUMAKER EDITOR ================= -->
  <defs>
    <clipPath id="editorClip"><rect x="0" y="0" width="548" height="468" rx="18"/></clipPath>
    <filter id="editorShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#172033" flood-opacity="0.09"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity="0.04"/>
    </filter>
    <filter id="paperShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
  </defs>
  <g transform="translate(594 81)" filter="url(#editorShadow)">
    <rect width="548" height="468" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <g clip-path="url(#editorClip)">
      <!-- quiet top toolbar -->
      <rect width="548" height="48" fill="#ffffff"/>
      <line x1="0" y1="48" x2="548" y2="48" stroke="#edf0f4"/>
      <circle cx="22" cy="24" r="4" fill="#ff6677" opacity=".9"/>
      <circle cx="36" cy="24" r="4" fill="#f3c36a" opacity=".8"/>
      <circle cx="50" cy="24" r="4" fill="#9bc9b1" opacity=".85"/>
      <rect x="365" y="14" width="78" height="20" rx="10" fill="#f7f8fa"/>
      <rect x="455" y="14" width="76" height="20" rx="10" fill="#fff0f2"/>

      <!-- left section rail: quiet abstract navigation -->
      <rect x="0" y="49" width="94" height="419" fill="#ffffff"/>
      <line x1="94" y1="49" x2="94" y2="468" stroke="#edf0f4"/>
      <rect x="10" y="68" width="74" height="29" rx="8" fill="#fff0f2"/>
      <rect x="22" y="79" width="7" height="7" rx="2" fill="#ff5368"/>
      <rect x="36" y="79" width="34" height="7" rx="3.5" fill="#f6a2ad" opacity=".75"/>
      <g fill="#d5dbe3">
        <circle cx="25" cy="119" r="4"/><rect x="36" y="116" width="36" height="6" rx="3"/>
        <circle cx="25" cy="157" r="4"/><rect x="36" y="154" width="43" height="6" rx="3"/>
        <circle cx="25" cy="195" r="4"/><rect x="36" y="192" width="31" height="6" rx="3"/>
        <circle cx="25" cy="233" r="4"/><rect x="36" y="230" width="39" height="6" rx="3"/>
        <circle cx="25" cy="271" r="4"/><rect x="36" y="268" width="34" height="6" rx="3"/>
        <circle cx="25" cy="309" r="4"/><rect x="36" y="306" width="42" height="6" rx="3"/>
        <circle cx="25" cy="347" r="4"/><rect x="36" y="344" width="29" height="6" rx="3"/>
      </g>

      <!-- center editing surface: light, sparse field rhythm -->
      <rect x="95" y="49" width="203" height="419" fill="#ffffff"/>
      <line x1="298" y1="49" x2="298" y2="468" stroke="#edf0f4"/>
      <rect x="112" y="69" width="86" height="9" rx="4.5" fill="#273247" opacity=".82"/>
      <rect x="112" y="85" width="58" height="5" rx="2.5" fill="#c5ccd6"/>
      <rect x="250" y="68" width="31" height="18" rx="6" fill="#fff0f2"/>
      <rect x="112" y="108" width="169" height="337" rx="10" fill="#ffffff" stroke="#e8ecf1"/>
      <g transform="translate(125 126)">
        <rect width="70" height="6" rx="3" fill="#7d8796"/>
        <rect y="14" width="142" height="29" rx="6" fill="#ffffff" stroke="#dce2e9"/>
        <rect x="10" y="25" width="78" height="5" rx="2.5" fill="#d4dae2"/>
        <rect y="58" width="58" height="6" rx="3" fill="#7d8796"/>
        <rect y="72" width="142" height="29" rx="6" fill="#ffffff" stroke="#dce2e9"/>
        <rect x="10" y="83" width="96" height="5" rx="2.5" fill="#e0e4ea"/>
        <rect y="116" width="67" height="6" rx="3" fill="#7d8796"/>
        <rect y="130" width="142" height="29" rx="6" fill="#ffffff" stroke="#dce2e9"/>
        <rect x="10" y="141" width="64" height="5" rx="2.5" fill="#e0e4ea"/>
        <rect y="174" width="52" height="6" rx="3" fill="#7d8796"/>
        <rect y="188" width="142" height="54" rx="6" fill="#ffffff" stroke="#dce2e9"/>
        <rect x="10" y="200" width="119" height="5" rx="2.5" fill="#e0e4ea"/>
        <rect x="10" y="212" width="104" height="5" rx="2.5" fill="#e0e4ea"/>
        <rect x="10" y="224" width="88" height="5" rx="2.5" fill="#e0e4ea"/>
      </g>

      <!-- right live document preview: restrained, text-free paper layout -->
      <rect x="299" y="49" width="249" height="419" fill="#f7f8fa"/>
      <g transform="translate(322 66)" filter="url(#paperShadow)">
        <rect width="204" height="326" rx="5" fill="#ffffff" stroke="#e6e9ee"/>
        <g transform="translate(17 19)">
          <rect width="91" height="10" rx="3" fill="#253047" opacity=".9"/>
          <rect y="17" width="57" height="5" rx="2.5" fill="#ff7182" opacity=".85"/>
          <rect y="30" width="145" height="4" rx="2" fill="#cbd2dc"/>
          <rect y="39" width="116" height="4" rx="2" fill="#e0e4ea"/>
          <line x1="0" y1="55" x2="170" y2="55" stroke="#e7ebf0"/>
          <rect y="70" width="54" height="6" rx="3" fill="#364257"/>
          <rect y="84" width="168" height="4" rx="2" fill="#cbd2dc"/>
          <rect y="93" width="156" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="102" width="143" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="124" width="67" height="6" rx="3" fill="#364257"/>
          <rect y="138" width="168" height="4" rx="2" fill="#cbd2dc"/>
          <rect y="147" width="158" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="156" width="149" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="165" width="132" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="188" width="49" height="6" rx="3" fill="#364257"/>
          <rect y="202" width="168" height="4" rx="2" fill="#cbd2dc"/>
          <rect y="211" width="145" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="220" width="157" height="4" rx="2" fill="#e0e4ea"/>
          <rect y="243" width="58" height="6" rx="3" fill="#364257"/>
          <g transform="translate(0 257)" fill="#fcecef">
            <rect width="43" height="15" rx="7.5"/><rect x="50" width="51" height="15" rx="7.5"/><rect x="108" width="60" height="15" rx="7.5"/>
          </g>
        </g>
      </g>
      <!-- subtle page depth, no floating labels or promotional badges -->
      <ellipse cx="425" cy="414" rx="104" ry="9" fill="#dfe4eb" opacity=".25"/>
    </g>
  </g>

</svg>
